[target.x86_64-pc-windows-msvc]
linker = "lld-link.exe"

[alias]
test-all = "test"
test-eigc-app = "test --package eigc_app --features dev"
test-eigc-common = "test --package eigc_common"
test-eigc-menu = "test --package eigc_menu"
test-eigc-moons = "test --package eigc_moons --features dev"
test-eigc-perf = "test --package eigc_perf"
test-eigc-scene = "test --package eigc_scene --features dev"
test-eigc-sim = "test --package eigc_sim --features dev"
test-eigc-terrain = "test --package eigc_terrain --features dev"

# all é lento, então só usar antes de fazer o commit
test-all-verbose = "test --verbose"
#
test-eigc-app-verbose = "test --package eigc_app --features dev --verbose"
test-eigc-common-verbose = "test --package eigc_common --verbose"
test-eigc-menu-verbose = "test --package eigc_menu --verbose"
test-eigc-moons-verbose = "test --package eigc_moons --features dev --verbose"
test-eigc-perf-verbose = "test --package eigc_perf --verbose"
test-eigc-scene-verbose = "test --package eigc_scene --features dev --verbose"
test-eigc-sim-verbose = "test --package eigc_sim --features dev --verbose"
test-eigc-terrain-verbose = "test --package eigc_terrain --features dev --verbose"

# run
run-eigc-app = "run --package eigc_app --features dev"
# só debug: pula o menu e entra direto em Europa
run-eigc-europa = "run --package eigc_app --features dev -- --europa"
# só debug: entra em Europa com a câmera em voo livre na posição dada.
# uso: cargo run-eigc-europa-at <x> <y> <z>  (metros; o terreno é centrado em 0,0 e tem ~22 km)
run-eigc-europa-at = "run --package eigc_app --features dev -- --europa --spawn"
# só debug: pula o menu e entra direto em Io
run-eigc-io = "run --package eigc_app --features dev -- --io"
# só debug: entra em Io com a câmera em voo livre na posição dada (mesmo uso de run-eigc-europa-at)
run-eigc-io-at = "run --package eigc_app --features dev -- --io --spawn"