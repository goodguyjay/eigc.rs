[workspace]
members = [
    "crates/eigc_app",
    "crates/eigc_common",
    "crates/eigc_moons",
    "crates/eigc_perf",
    "crates/eigc_scene",
    "crates/eigc_sim",
    "crates/eigc_terrain",
    "crates/eigc_testkit",
]
resolver = "2"

[workspace.package]
edition = "2024"

[workspace.dependencies]
bevy = { version = "0.18.1", features = ["jpeg", "png", "file_watcher"] }
noise = { version = "0.9.0" }
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
rstest = "0.26.1"
proptest = "1.11.0"
thiserror = "2.0.20"

eigc_app = { path = "crates/eigc_app" }
eigc_common = { path = "crates/eigc_common" }
eigc_sim = { path = "crates/eigc_sim" }
eigc_moons = { path = "crates/eigc_moons" }
eigc_terrain = { path = "crates/eigc_terrain" }
eigc_scene = { path = "crates/eigc_scene" }
eigc_testkit = { path = "crates/eigc_testkit" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
